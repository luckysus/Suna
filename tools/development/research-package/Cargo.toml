[package]
name = "suna-research-package-isolated"
version = "0.1.0"
edition = "2021"

[dependencies]
suna = { path = "../../../src-tauri" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4.0", default-features = false, features = ["deflate-flate2"] }
