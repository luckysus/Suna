<!doctype html>
<html lang="zh-CN" style="background-color: #222226; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suna</title>
    <script>
      (function() {
        try {
          var theme = "dark";
          var stored = localStorage.getItem("suna.ui.theme");
          if (stored) {
            var parsed = JSON.parse(stored);
            var pref = parsed && (parsed.preference || parsed);
            if (pref === "light") theme = "light";
            else if (pref === "dark") theme = "dark";
            else if (pref === "system" && window.matchMedia) {
              theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = theme === "light" ? "#fbfaf7" : "#222226";
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --boot-bg: #222226;
        --boot-card-bg: rgba(38, 38, 44, 0.78);
        --boot-card-border: rgba(255, 255, 255, 0.08);
        --boot-text: #f4f4f5;
        --boot-text-muted: #a1a1aa;
        --boot-glow: rgba(45, 101, 241, 0.22);
        --boot-track: rgba(255, 255, 255, 0.08);
        --boot-runner: linear-gradient(90deg, #2D65F1, #35A8F7, #579CF3);
      }

      [data-theme="light"] {
        --boot-bg: #fbfaf7;
        --boot-card-bg: rgba(255, 255, 255, 0.88);
        --boot-card-border: rgba(0, 0, 0, 0.06);
        --boot-text: #18181b;
        --boot-text-muted: #71717a;
        --boot-glow: rgba(45, 101, 241, 0.1);
        --boot-track: rgba(0, 0, 0, 0.06);
        --boot-runner: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
      }

      [data-theme="dark"] {
        --boot-bg: #222226;
        --boot-card-bg: rgba(38, 38, 44, 0.78);
        --boot-card-border: rgba(255, 255, 255, 0.08);
        --boot-text: #f4f4f5;
        --boot-text-muted: #a1a1aa;
        --boot-glow: rgba(45, 101, 241, 0.22);
        --boot-track: rgba(255, 255, 255, 0.08);
        --boot-runner: linear-gradient(90deg, #2D65F1, #35A8F7, #579CF3);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--boot-bg);
        color: var(--boot-text);
        font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      #root {
        min-height: 100vh;
      }

      #suna-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--boot-bg);
        transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1);
        user-select: none;
      }

      #suna-boot-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .suna-boot-ambient {
        position: absolute;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--boot-glow) 0%, transparent 70%);
        pointer-events: none;
        animation: suna-boot-halo 3s ease-in-out infinite alternate;
      }

      .suna-boot-card {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 34px 44px 30px;
        border: 1px solid var(--boot-card-border);
        border-radius: 22px;
        background: var(--boot-card-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
        animation: suna-boot-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .suna-boot-logo {
        width: 58px;
        height: 58px;
        filter: drop-shadow(0 8px 18px rgba(45, 101, 241, 0.38));
        animation: suna-boot-float 2.8s ease-in-out infinite;
      }

      .suna-boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 18px;
        text-align: center;
      }

      .suna-boot-wordmark {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.18em;
        line-height: 1.2;
        color: var(--boot-text);
      }

      .suna-boot-tagline {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--boot-text-muted);
        margin-top: 5px;
        text-transform: uppercase;
      }

      .suna-boot-progress {
        width: 156px;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-track);
        margin-top: 24px;
        overflow: hidden;
        position: relative;
      }

      .suna-boot-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-runner);
        box-shadow: 0 0 12px rgba(53, 168, 247, 0.65);
        animation: suna-boot-loading 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes suna-boot-enter {
        0% {
          opacity: 0;
          transform: translateY(14px) scale(0.93);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes suna-boot-float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes suna-boot-halo {
        0% {
          opacity: 0.55;
          transform: scale(0.88);
        }
        100% {
          opacity: 1;
          transform: scale(1.12);
        }
      }

      @keyframes suna-boot-loading {
        0% {
          left: -40%;
          width: 30%;
        }
        50% {
          left: 28%;
          width: 58%;
        }
        100% {
          left: 100%;
          width: 30%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .suna-boot-card,
        .suna-boot-logo,
        .suna-boot-ambient {
          animation: none;
        }
        .suna-boot-progress-bar {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body style="background-color: #222226; color-scheme: dark; margin: 0; padding: 0;">
    <div id="root"></div>
    <div id="suna-boot-screen" role="status" aria-label="Suna">
      <div class="suna-boot-ambient" aria-hidden="true"></div>
      <div class="suna-boot-card">
        <svg class="suna-boot-logo" viewBox="0 0 80 80" fill="none" role="img" aria-label="Suna Logo">
          <defs>
            <linearGradient id="suna-boot-top" x1="12" y1="8" x2="67" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#2D65F1" /><stop offset=".52" stop-color="#35A8F7" /><stop offset="1" stop-color="#1689E8" /></linearGradient>
            <linearGradient id="suna-boot-left" x1="12" y1="18" x2="40" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#2C64E9" /><stop offset="1" stop-color="#579CF3" /></linearGradient>
            <linearGradient id="suna-boot-right" x1="40" y1="39" x2="69" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#1C43D1" /><stop offset="1" stop-color="#1A73EA" /></linearGradient>
          </defs>
          <g>
            <path d="M40 4 68 20 54 28 40 20 26 28 12 20 40 4Z" fill="url(#suna-boot-top)" />
            <path d="M12 20 26 28 40 36v14L12 34V20Z" fill="url(#suna-boot-left)" />
            <path d="M68 20 54 28 40 36v14l28-16V20Z" fill="url(#suna-boot-right)" />
          </g>
          <g>
            <path d="M40 30 68 46 54 54 40 46 26 54 12 46 40 30Z" fill="url(#suna-boot-top)" />
            <path d="M12 46 26 54 40 62v14L12 60V46Z" fill="url(#suna-boot-left)" />
            <path d="M68 46 54 54 40 62v14l28-16V46Z" fill="url(#suna-boot-right)" />
          </g>
        </svg>
        <div class="suna-boot-brand">
          <span class="suna-boot-wordmark">SUNA</span>
          <span class="suna-boot-tagline">Steel Research Agent</span>
        </div>
        <div class="suna-boot-progress" aria-hidden="true">
          <div class="suna-boot-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
